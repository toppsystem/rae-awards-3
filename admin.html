async function pwl(){const r=await api('login',{email:val('em'),password:val('pw')});if(r.ok){keep(r.access_token,r.refresh_token);show()}else say(r.error)}
async function sendc(){const r=await api('otp_send',{email:val('em')});say(r.error||r.message,r.ok)}
async function enr(){const r=await api('enroll',{email:val('em'),code:val('cd'),password:val('pw')});if(r.ok){lf('in');say(r.message,1)}else say(r.error)}
async function vsend(){const r=await api('verify_send');say(r.error||r.message,r.ok)}
async function vgo(){const r=await api('verify',{code:val('cd')});if(r.ok)show();else say(r.error)}
async function show(){if(!S.tok){$('#lg').style.display='grid';return lf('in')}
  const m=await api('me',{fresh:S.fresh});S.fresh=0;if(!m.ok){return S.tok?out(m.error):0}
  S.me=m;if(m.verify){$('#lg').style.display='grid';return lf('ver')}
  $('#lg').style.display='none';$('#hn').textContent=m.email.split('@')[0];$('#hr').textContent=LBL[m.role];$('#ha').textContent=m.email.slice(0,2).toUpperCase();go(NAV[m.role][0])}
async function go(t,k){S.tab=t;if(!k){scrollTo(0,0);$('#m').innerHTML='<div class="empty">Loading…</div>'}
  $('#nv').innerHTML=NAV[S.me.role].map(x=>T.find(y=>y[0]==x)).map(n=>`<button class="${n[0]==t?'on':''}" onclick="go('${n[0]}')">${I(n[1])}${n[2]}</button>`).join('');
  let h;try{h=await V[t]()}catch{h=bad({})}if(S.tab==t){$('#m').innerHTML=h;if(t=='gate'&&!k&&$('#tk'))$('#tk').focus()}}
const A=(a,d,m,c,x)=>`<button class="btn s ${c||''}" data-a="${a}" data-d="${esc(JSON.stringify(d))}" data-m="${esc(m)}">${x}</button>`;
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;b.disabled=true;const r=await api(b.dataset.a,JSON.parse(b.dataset.d||'{}'));toast(r.error||b.dataset.m||'Saved');b.disabled=false;if(r.ok)go(S.tab,1)});
const act=async(a,d,m)=>{const r=await api(a,d);toast(r.error||m);if(r.ok)go(S.tab,1);return r};
/* views */
const V={
async home(){const o=await api('overview');if(!o.ok)return bad(o);const g=S.me.role=='gate',sold=o.tiers.reduce((s,t)=>s+t.sold,0),rev=g?0:o.tiers.reduce((s,t)=>s+t.revenue,0),exp=o.tiers.reduce((s,t)=>s+t.sold*(t.guests||1),0),cap=o.capacity||exp,pct=cap?Math.min(100,o.people_in/cap*100):0,mx=Math.max(1,...o.by_category.map(c=>c.votes)),hm=Math.max(1,...o.hourly.map(h=>h.n)),sp=o.hourly.filter(h=>h.spike).length;
  return `<div class="hero"><div class="beam"></div><div class="sm" style="letter-spacing:.2em">${g?'GUESTS INSIDE':'TOTAL VOTES'}</div><div class="big gold">${(g?o.people_in:o.votes_total).toLocaleString()}</div><div class="pg"><i style="width:${pct}%"></i></div><small>${o.people_in} of ${cap} guests in${o.capacity?'':' (expected)'}</small><div class="st"><div><b>${g?sold:o.voters.toLocaleString()}</b>${g?'passes sold':'voters'}</div><div><b>${g?cap:sold}</b>${g?'capacity':'passes sold'}</div><div><b>${g?Math.round(pct)+'%':N(rev)}</b>${g?'full':'ticket revenue'}</div></div></div>`+(g?'':
  `${sp?`<div class="card al"><b>Unusual voting</b><small style="display:block">${sp} busy hour${sp>1?'s':''} in the last 24h. Check it, then pause a category if needed.</small></div>`:''}
  <div class="hm"><div><h3 class="sec">Votes by category</h3><div class="card">${o.by_category.map(c=>`<div class="row"><div class="i"><b>${esc(c.name)} ${c.paused?'<span class="pk">· paused</span>':''}</b><div class="bar"><i style="width:${c.votes/mx*100}%"></i></div></div><b class="serif" style="color:var(--ch)">${c.votes}</b></div>`).join('')}</div></div>
  <div><h3 class="sec">Votes per hour, 24h</h3><div class="card">${o.hourly.length?`<div style="display:flex;align-items:flex-end;gap:3px;height:90px">${o.hourly.map(h=>`<i title="${h.n}" style="flex:1;height:${Math.max(4,h.n/hm*100)}%;background:${h.spike?'#e6566a':'var(--g)'};border-radius:3px 3px 0 0"></i>`).join('')}</div>`:'<div class="empty">No votes yet.</div>'}</div>
  <h3 class="sec">Passes</h3><div class="card">${o.tiers.map(t=>`<div class="row"><div class="i"><b>${esc(t.name)}</b><small>${t.sold} sold · ${N(t.revenue)}</small></div></div>`).join('')}</div></div></div>`)},
async gate(){return `<h2>Gate</h2><button class="scanbtn" onclick="cam()">${I('cam')}Scan</button><input id="tk" placeholder="Paste code or payment reference" autocomplete="off" autocapitalize="off" onkeydown="if(event.key=='Enter')scan()"><button class="btn b1 w" style="margin-top:10px" onclick="scan()">Check in</button><div id="rs">${resH()}</div>`},
async vote(){const [s,n,o]=await Promise.all([api('settings_get'),L('nominees_list'),api('overview')]);if(!o.ok)return bad(o);const su=S.me.role=='super',d=su?'':'disabled',cs=o.by_category,loc=v=>v?new Date(new Date(v)-new Date(v).getTimezoneOffset()*6e4).toISOString().slice(0,16):'';
  if(!S.cat)S.cat=cs[0]&&cs[0].id;const cn=Object.fromEntries(cs.map(c=>[c.id,c.name]));
  return `<h2>Voting</h2><div class="hm"><div><div class="card"><b>Window, notice and capacity</b>${su?'':'<small style="display:block">Only the super admin can change these.</small>'}<small>Opens</small><input id="vo" type="datetime-local" value="${loc(s.vote_open)}" ${d}><small>Closes</small><input id="vc" type="datetime-local" value="${loc(s.vote_close)}" ${d}><small>Notice on the public site (empty hides it)</small><textarea id="nt" rows="2" maxlength="280" ${d}>${esc(s.notice)}</textarea><small>Venue capacity</small><input id="cp" type="number" min="0" value="${s.capacity||0}" ${d}>${su?'<button class="btn b1 w" style="margin-top:12px" onclick="saveSet()">Save</button>':''}</div>
  <h3 class="sec">Categories live</h3><div class="card">${cs.map(c=>`<div class="row"><div class="i"><b>${esc(c.name)}</b><small>${c.paused?'Paused':'Live'} · ${c.votes} votes</small></div><button class="tog ${c.paused?'':'on'}" aria-label="Toggle ${esc(c.name)}" data-a="category_pause" data-d="${esc(JSON.stringify({id:c.id,paused:c.paused?0:1}))}" data-m="${c.paused?'Voting resumed':'Voting paused'}"></button></div>`).join('')}</div></div>
  <div><div class="card"><b>Add nominee</b><select id="nc">${cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><input id="nn" placeholder="Name" style="margin-top:8px"><input id="nb" placeholder="Business (optional)" style="margin-top:8px"><input id="np" placeholder="Photo link https://… (optional)" style="margin-top:8px"><button class="btn b1 w" style="margin-top:12px" onclick="addNom()">Add nominee</button></div>
  <h3 class="sec">Nominees</h3><div class="chips" style="margin:10px 0">${cs.map(c=>`<button class="chip ${c.id==S.cat?'on':''}" onclick="S.cat=${c.id};go('vote',1)">${esc(c.name)}</button>`).join('')}</div><div class="card">${n.filter(x=>x.category_id==S.cat).map(x=>`<div class="row"><div class="i"><b>${esc(x.name)}</b><small>${esc(x.biz||'')} ${x.active?'':'· hidden'}</small></div>${A('nominee_toggle',{id:x.id,active:!x.active},'Saved','',x.active?'Hide':'Show')}</div>`).join('')||'<div class="empty">No nominees here yet.</div>'}</div></div></div>`},
async tix(){const o=await api('overview');if(!o.ok)return bad(o),f=S.found,su=S.me.role=='super';
  return `<h2>Tickets</h2><div class="tiles">${o.tiers.map(t=>`<div class="tile"><b>${esc(t.name)}</b><div class="vt">${t.sold}</div><small>${t.in} arrived · ${N(t.revenue)}</small></div>`).join('')}</div>
  <div class="hm"><div><h3 class="sec">Find a pass</h3><div class="card"><input id="rf" placeholder="Payment reference" autocomplete="off" onkeydown="if(event.key=='Enter')findT()"><button class="btn b1 w" style="margin-top:10px" onclick="findT()">Find</button>${f?`<div class="row" style="margin-top:12px"><div class="i"><b>${esc(f.buyer_name)} · ${esc(f.tier_id)}</b><small>${esc(f.email||'')} · ${esc(f.phone||'')}</small><small>${f.revoked?'REVOKED':f.guests_in?f.guests_in+' guest(s) in':'Not arrived'}</small></div></div><input id="sv" placeholder="Table number (e.g. T4)" value="${esc(f.seat||'')}"><div class="acts"><button class="btn s" onclick="updT('seat')">Save table</button>${su?`<button class="btn s ${f.revoked?'':'br'}" onclick="updT('${f.revoked?'restore':'revoke'}')">${f.revoked?'Restore pass':'Revoke pass'}</button>`:''}</div>`:''}</div></div>
  <div><h3 class="sec">Export</h3><div class="card"><div class="acts"><button class="btn b1" onclick="exp('tickets')">Tickets CSV</button><button class="btn" onclick="exp('votes')">Vote tallies CSV</button></div><small style="display:block;margin-top:10px">The tickets file holds buyers' emails and phone numbers. Keep it private.</small></div></div></div>`},
async team(){const [a,l]=await Promise.all([L('admins_list'),L('audit_list')]);
  return `<h2>Team</h2><div class="hm"><div><div class="card">${a.map(x=>`<div class="row"><span class="ava sm2">${esc(x.email.slice(0,2).toUpperCase())}</span><div class="i"><b>${esc(x.email)}</b><small><span class="dot ${x.active?'':'off'}"></span>${x.enrolled_at?'registered':'not registered yet'}</small></div>${x.email==S.me.email?'<small>you</small>':`<select data-e="${esc(x.email)}" onchange="roleSet(this)" style="width:auto;padding:8px">${['gate','admin','super'].map(r=>`<option ${r==x.role?'selected':''}>${r}</option>`).join('')}</select>${A('admin_set',{email:x.email,active:!x.active},'Saved','',x.active?'Disable':'Enable')}`}</div>`).join('')}</div>
  <h3 class="sec">Add an admin</h3><div class="card"><input id="ae" type="email" placeholder="their@gmail.com"><select id="ar" style="margin-top:8px"><option value="gate">Gate (check-in only)</option><option value="admin">Admin</option><option value="super">Super admin</option></select><button class="btn b1 w" style="margin-top:12px" onclick="act('admin_add',{email:val('ae'),role:val('ar')},'Added. Tell them to register with their email.')">Add</button></div></div>
  <div><h3 class="sec" style="margin-top:0">Recent activity</h3><div class="card">${l.map(x=>`<div class="row"><div class="i"><b style="font-weight:600">${esc(x.action.replace(/_/g,' '))}</b><small>${esc(x.actor)}</small></div><small>${new Date(x.at).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</small></div>`).join('')||'<div class="empty">Nothing yet.</div>'}</div></div></div>`},
async me(){const m=S.me;return `<div class="hero" style="text-align:center"><div class="beam"></div><span class="ava" style="width:96px;height:96px;font-size:34px;margin:0 auto 12px">${esc(m.email.slice(0,2).toUpperCase())}</span><h2 class="gold">${esc(m.email.split('@')[0])}</h2><div class="sm">${esc(m.email)} · ${LBL[m.role]} · ${esc(m.via)}</div></div><button class="btn br w" style="margin-top:18px" onclick="out()">Sign out</button>`}};
/* actions */
const resH=()=>{const r=S.res;if(!r)return'';const ok=r.result=='OK',used=r.result=='ALREADY_USED',left=(r.guests||0)-(r.guests_in||0),h=ok?'Valid. Let them in.':used?'Already used':r.result=='REVOKED'?'Pass revoked':r.result=='INVALID'?'Not a valid pass':(r.error||'Error');
  return `<div class="res ${ok?'ok':'no'}"><h3>${h}</h3>${r.buyer_name?`<p>${esc(r.buyer_name)} · ${esc(r.tier_id)}${r.seat?' · Table '+esc(r.seat):''}</p>`:''}${r.guests>1&&(ok||used)?`<p><b>${r.guests_in} of ${r.guests}</b> guests in</p>`:''}${ok&&left>0?`<button class="btn b1 w" style="margin-top:10px" onclick="scan(S.last,true)">Admit remaining ${left}</button>`:''}</div>`};
async function scan(v,all){const t=(v||val('tk')).trim();if(!t)return;if($('#tk'))$('#tk').value='';const m=t.match(/[0-9a-f]{64}/i);S.last=m?m[0]:t;const r=await api('checkin',m?{token:m[0],all}:{reference:t,all});S.res=r;if(navigator.vibrate)navigator.vibrate(r.result=='OK'?60:[90,60,90]);if($('#rs'))$('#rs').innerHTML=resH();if($('#tk'))$('#tk').focus()}
async function cam(){if(!window.BarcodeDetector)return toast('Camera scan is not supported in this browser. Paste the code instead.');try{const d=new BarcodeDetector({formats:['qr_code']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});sheet('<h3>Scan the pass</h3><video id="vd" playsinline muted style="width:100%;border-radius:16px"></video><button class="btn w" onclick="cl()">Close</button>');const v=$('#vd');v.srcObject=stream;await v.play();(async function lp(){if(!stream)return;try{const c=await d.detect(v);if(c[0]){const t=c[0].rawValue;cl();return scan(t)}}catch{}setTimeout(lp,250)})()}catch{toast('Camera blocked. Allow it, or paste the code.')}}
function saveSet(){const p={notice:val('nt'),capacity:Number(val('cp'))};if(val('vo')&&val('vc')){p.vote_open=new Date(val('vo')).toISOString();p.vote_close=new Date(val('vc')).toISOString()}act('settings_set',p,'Saved. The public site shows it on next load.')}
const addNom=()=>act('nominee_add',{category_id:val('nc'),name:val('nn'),biz:val('nb'),photo_url:val('np')},'Nominee added');
async function findT(){const r=await api('ticket_get',{reference:val('rf')});if(!r.ok)return toast(r.error);S.found=r;go('tix',1)}
async function updT(k){const d={reference:S.found.reference};if(k=='seat')d.seat=val('sv');else d.revoked=k=='revoke';const r=await act('ticket_update',d,'Saved');if(r.ok)findT2()}
async function findT2(){const r=await api('ticket_get',{reference:S.found.reference});if(r.ok){S.found=r;go('tix',1)}}
const roleSet=el=>act('admin_set',{email:el.dataset.e,role:el.value},'Role updated');
async function exp(what){const r=await api('export',{what});if(!r.ok)return toast(r.error);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r.csv],{type:'text/csv'}));a.download=r.filename;a.click();toast('Downloaded '+r.filename)}
setInterval(()=>{if(S.me&&!S.me.verify&&S.tab=='home'&&!$('#ov.on'))go('home',1)},20000);
show();
</script></body></html>
